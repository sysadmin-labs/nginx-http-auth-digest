# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file
#
# The probe sends an unauthenticated request on every reload: a reload that
# detached the auth_digest handler would keep answering on the port but stop
# turning the request into a 401 Digest challenge.  auth_digest_shm_size
# declares the module's shared-memory zone at the http level, so that zone is
# set up and then carried across every reload, which is the per-cycle state
# most likely to leak here.

mkdir -p "$WORK/root"
# user file: alice:restricted:md5(alice:restricted:secret)
ha1=$(printf '%s' "alice:restricted:secret" | md5sum | cut -d' ' -f1)
printf 'alice:restricted:%s\n' "$ha1" > "$WORK/htdigest"
[ -f "$WORK/root/probe.txt" ] || printf 'reloaded' > "$WORK/root/probe.txt"

RELOAD_HTTP="
    auth_digest_shm_size 4m;"

RELOAD_SERVER="
        location / {
            root $WORK/root;
            auth_digest_user_file $WORK/htdigest;
            auth_digest \"restricted\";
        }"

RELOAD_EXPECT='401'

reload_probe() {
	curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
		"http://127.0.0.1:$PORT/probe.txt"
}
